<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OROSE64 – Roblox Luau Base64 Obfuscator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { color: #7c3aed; margin-bottom: 0.5rem; }
    p { color: #a0a0a0; margin-bottom: 2rem; }
    textarea {
      width: 100%;
      height: 220px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 1rem;
      font-family: ui-monospace, monospace;
      font-size: 14px;
      resize: vertical;
    }
    button {
      margin-top: 1rem;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
    .output-section { margin-top: 2rem; }
    label { display: block; margin-bottom: 0.5rem; color: #a0a0a0; }
  </style>
</head>
<body>
  <h1>OROSE64</h1>
  <p>Roblox Luau / Lua → Base64 obfuscator</p>

  <label>Paste your original script:</label>
  <textarea id="input" placeholder="-- your Luau code here"></textarea>

  <button onclick="obfuscate()">Obfuscate with OROSE64</button>

  <div class="output-section">
    <label>Obfuscated output:</label>
    <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
  </div>

  <script>
    function obfuscate() {
      const code = document.getElementById("input").value;
      if (!code.trim()) {
        alert("Paste a script first");
        return;
      }

      // Convert to Base64 (browser-safe)
      const base64 = btoa(unescape(encodeURIComponent(code)));

      const result = `-- this was obfuscated with OROSE64
local HttpService = game:GetService("HttpService")
loadstring(HttpService:Base64Decode("${base64}"))()`;

      document.getElementById("output").value = result;
    }
  </script>
</body>
</html>
